version: '3.8'

services:
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: entertainment-tadka-bot
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_ID=${ADMIN_ID}
      - PORT=80
      - TZ=Asia/Kolkata
    volumes:
      - ./movies.csv:/var/www/html/movies.csv
      - ./users.json:/var/www/html/users.json
      - ./bot_stats.json:/var/www/html/bot_stats.json
      - ./movie_requests.json:/var/www/html/movie_requests.json
      - ./bot_activity.log:/var/www/html/bot_activity.log
      - ./error.log:/var/www/html/error.log
      - ./backups:/var/www/html/backups
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

